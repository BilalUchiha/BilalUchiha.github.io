const koi=[];function makeKoi(i){const group=new THREE.Group();const bodyMat=new THREE.MeshStandardMaterial({color:i%3===0?0xece2ca:0xf2ead9,roughness:.3,metalness:.04});const body=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),bodyMat);body.scale.set(.68,.22,.3);group.add(body);if(i%3!==2){for(let j=0;j<3;j++){const patch=new THREE.Mesh(new THREE.SphereGeometry(1,10,8),new THREE.MeshStandardMaterial({color:i%2?0xc45f44:0xb94c3b,roughness:.4}));patch.scale.set(.2,.07,.27);patch.position.set(rr(-.38,.38),.15,rr(-.02,.02));group.add(patch)}}if(i%3===2){const spot=new THREE.Mesh(new THREE.SphereGeometry(.19,12,8),new THREE.MeshStandardMaterial({color:0x343b36,roughness:.5}));spot.position.set(.12,.19,0);group.add(spot)}const tail=new THREE.Mesh(new THREE.ConeGeometry(.2,.54,5),bodyMat);tail.rotation.z=-Math.PI/2;tail.position.x=-.88;tail.scale.set(1,.7,.55);group.add(tail);const finmat=new THREE.MeshStandardMaterial({color:0xe4d7bb,roughness:.4,side:THREE.DoubleSide});for(let side of [-1,1]){const fin=new THREE.Mesh(new THREE.ConeGeometry(.12,.4,4),finmat);fin.rotation.z=side*.55;fin.position.set(-.1,-.03,side*.24);group.add(fin)}const rings=[];for(let r=0;r<2;r++){const ring=new THREE.Mesh(new THREE.TorusGeometry(.32+r*.16,.012,4,28),new THREE.MeshBasicMaterial({color:0xd4e2cf,transparent:true,opacity:.07,depthWrite:false}));ring.rotation.x=Math.PI/2;ring.position.y=.16;group.add(ring);rings.push(ring)}scene.add(group);koi.push({group,rings,tail,phase:rr(0,6.28),radius:rr(2,6.3),speed:rr(.16,.32),offset:rr(0,6.28),scale:rr(.62,.88)})}for(let i=0;i<9;i++)makeKoi(i);
