<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bilal's 3D Worlds</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap');
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 700px at 70% -10%,#1d2c33,#0d141a 60%);color:#ece7db;font-family:'DM Sans',sans-serif}
main{width:min(860px,90vw);text-align:center;padding:60px 0}
.kicker{font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:#c9a86a}
h1{font:500 44px 'Cormorant Garamond',serif;margin:14px 0 6px}
p.sub{color:#b9b3a5;font-size:13px;margin:0 0 44px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
a.card{display:block;padding:28px 22px;border:1px solid #ffffff1f;border-radius:6px;background:#121b23b8;text-decoration:none;color:inherit;transition:.25s}
a.card:hover{transform:translateY(-3px);border-color:#c9a86a66;background:#16212b}
.card .jp{font:400 26px 'Cormorant Garamond',serif;color:#d8bd8c}
.card h2{font:500 19px 'Cormorant Garamond',serif;margin:8px 0 6px}
.card span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9aa0a6}
</style>
</head>
<body><main>
<div class="kicker">Three.js experiments</div>
<h1>Bilal's 3D Worlds</h1>
<p class="sub">Three small interactive scenes — built with procedural geometry, rendered in your browser.</p>
<div class="grid">
<a class="card" href="garden/"><div class="jp">庭園</div><h2>The Quiet Garden</h2><span>Koi pond · tea house · torii</span></a>
<a class="card" href="ramen/"><div class="jp">夜更けの麺</div><h2>Midnight Noodles</h2><span>Rainy alley · lantern light</span></a>
<a class="card" href="observatory/"><div class="jp">星空</div><h2>The Quiet Observatory</h2><span>Summit dome · Milky Way</span></a>
</div>
</main></body></html>
